name: Verify live room signaling
on:
  push:
    branches: [verify-live-signaling]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci --omit=dev
      - name: Check room server from outside Render
        run: |
          node <<'JS'
          const { WebSocket } = require('ws');
          const { randomUUID } = require('node:crypto');
          const origin = 'https://agamer21.github.io';
          const domain = 'gang-beasts-multiplayer.onrender.com';
          const started = Date.now();
          async function request(path) {
            const response = await fetch('https://' + domain + path, { headers: { origin }, signal: AbortSignal.timeout(85000) });
            console.log(path, 'HTTP', response.status, 'after', Date.now() - started, 'ms');
            if (!response.ok) throw new Error(path + ' returned HTTP ' + response.status + ' (' + (await response.text()).slice(0,120) + ')');
            return response;
          }
          async function main() {
            const health = await request('/health');
            if ((await health.json()).status !== 'ok') throw new Error('Unexpected health response');
            const id = await request('/signal/peerjs/id');
            if (id.headers.get('access-control-allow-origin') !== origin) throw new Error('PeerJS ID response has the wrong CORS origin');
            const url = 'wss://' + domain + ':443/signal/peerjs?key=peerjs&id=arcade-smoke-' + randomUUID() + '&token=' + randomUUID() + '&version=1.5.5';
            await new Promise((resolve, reject) => {
              const ws = new WebSocket(url, { origin, handshakeTimeout: 15000 });
              ws.once('error', reject);
              ws.once('message', raw => {
                const { type } = JSON.parse(raw);
                ws.close();
                if (type === 'OPEN') resolve();
                else reject(new Error('WebSocket sent ' + type + ' instead of OPEN'));
              });
            });
            console.log('Live signaling returned OPEN');
            const sessionId = 'ag-arcade-gang-beasts-' + randomUUID().slice(0, 8);
            const requestRoom = async (path, headers={}, body) => {
              const response = await fetch('https://' + domain + '/rooms/' + path, {
                method: 'POST', headers: { origin, ...headers }, body, signal: AbortSignal.timeout(15000)
              });
              const result = await response.text();
              if (!response.ok) throw new Error('/rooms/' + path + ' HTTP ' + response.status + ' ' + result.slice(0,140));
              return result;
            };
            const { key } = JSON.parse(await requestRoom('open', { 'Content-Type': 'application/json' }, JSON.stringify({ id: sessionId })));
            const authorization = 'Bearer ' + key;
            const messages = JSON.parse(await requestRoom('poll', { authorization }));
            if (!messages.some(raw => JSON.parse(raw).type === 'OPEN')) throw new Error('HTTPS poll did not receive OPEN');
            await requestRoom('close', { authorization });
            console.log('HTTPS session returned OPEN');
          }
          main().catch(error => { console.error('::error::' + error.message.replace(/\n/g, ' ')); process.exitCode = 1; });
          JS
      - name: Wait for the updated lobby
        run: |
          for attempt in $(seq 1 24); do
            if curl -fsS --max-time 12 "https://agamer21.github.io/assets/arcade/gang-beasts-multiplayer/?check=join-confirm-3-$attempt" | grep -q 'join-confirm-3'; then
              exit 0
            fi
            sleep 10
          done
          echo '::error::Updated lobby did not appear on GitHub Pages'
          exit 1
      - name: Check the updated arcade lobby in Chrome
        run: |
          npm install --no-save --package-lock=false playwright-core pngjs
          node <<'JS'
          const { chromium } = require('playwright-core');
          const { PNG } = require('pngjs');
          (async () => {
            const browser = await chromium.launch({ executablePath: '/usr/bin/google-chrome', args: ['--no-sandbox', '--enable-unsafe-swiftshader', '--use-angle=swiftshader', '--disable-background-timer-throttling', '--disable-renderer-backgrounding', '--disable-backgrounding-occluded-windows'] });
            try {
              const diagnostic = [];
              const host = await browser.newPage();
              const guest = await browser.newPage();
              let gameStarted = false;
              host.on('console', line => { if (line.text().includes('[SPW] AddPlayer: Added')) gameStarted = true; });
              for (const page of [host, guest]) {
                await page.addInitScript(() => {
                  window.WebSocket = function () { throw new Error('Browser WebSockets are disabled for this test'); };
                });
                page.on('pageerror', error => console.log('Page error:', error.message));
                page.on('console', line => {
                  if (['error', 'warning'].includes(line.type())) diagnostic.push(line.text());
                });
                page.on('response', response => {
                  if (response.url().includes('/rooms/') && !response.ok()) diagnostic.push(response.status() + ' ' + response.url());
                });
                page.on('requestfailed', request => console.log('Request failed:', request.url(), request.failure()?.errorText));
                await page.goto('https://agamer21.github.io/assets/arcade/gang-beasts-multiplayer/?v=join-confirm-3', { waitUntil: 'domcontentloaded' });
              }
              let releaseProbe;
              const probeGate = new Promise(resolve => { releaseProbe = resolve; });
              await host.route('https://gang-beasts-multiplayer.onrender.com/signal/peerjs/id', async route => {
                await probeGate;
                await route.continue();
              });
              await host.getByRole('button', { name: 'Host room' }).click();
              if (await host.locator('#room-code').isVisible()) throw new Error('Code appeared before server confirmation');
              releaseProbe();
              await host.getByText('Share the room code').waitFor({ timeout: 85000 }).catch(async () => {
                throw new Error('Host room failed: ' + await host.locator('#status').innerText() + ' | ' + diagnostic.join(' | '));
              });
              console.log('Published lobby created a room');
              await guest.getByLabel('Room code').fill(await host.locator('#code').innerText());
              await guest.getByRole('button', { name: 'Join room' }).click();
              await host.getByRole('button', { name: 'Start match' }).waitFor({ timeout: 55000 }).catch(async () => {
                throw new Error('Join room failed: ' + await guest.locator('#status').innerText() + ' | ' + diagnostic.join(' | '));
              });
              console.log('Second browser joined the published room with WebSockets disabled');
              await host.route('**/ports/gang-beasts/?remote-play=*', async route => {
                const response = await route.fetch();
                const body = (await response.text()).replaceAll('devicePixelRatio: 1', 'devicePixelRatio: 0.55');
                await route.fulfill({ response, body });
              });
              await host.locator('#game').evaluate(game => { game.style.width = '640px'; game.style.height = '400px'; });
              await host.getByRole('button', { name: 'Start match' }).click();
              await guest.getByRole('button', { name: 'Join as player 2' }).waitFor({ timeout: 25000 });
              const frame = host.frameLocator('#game');
              const canvas = frame.locator('canvas');
              await frame.locator('#unity-loading-bar').waitFor({ state: 'hidden', timeout: 150000 });
              await guest.waitForFunction(() => document.querySelector('video').videoWidth > 0, null, { timeout: 90000 });
              console.log('The real Unity canvas is streaming to the guest');
              await host.bringToFront();
              await canvas.focus();
              const sample = async () => PNG.sync.read(await canvas.screenshot({ timeout: 18000 }));
              function fighter(image, color, x0=0, y0=0, x1=image.width, y1=image.height) {
                let n = 0, sx = 0, sy = 0;
                for (let y = y0; y < Math.min(y1, image.height); y++) {
                  for (let x = x0; x < Math.min(x1, image.width); x++) {
                    const i = (y * image.width + x) * 4;
                    const [r,g,b] = image.data.subarray(i, i + 3);
                    const match = color === 'red' ? r > 145 && g < .42*r && b < .4*r :
                      color === 'blue' ? b > 145 && r < .38*b && g > .58*b && g < .88*b :
                      r > 190 && g > 150 && b < 70;
                    if (match) { n++; sx += x; sy += y; }
                  }
                }
                return { n, x: sx/n, y: sy/n };
              }
              const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
              let local;
              for (let i = 0; i < 18; i++) {
                const image = await sample();
                if (fighter(image, 'red', 335, 275, 414, 356).n > 250 &&
                    fighter(image, 'yellow', 490, 334, 635, 357).n > 30) {
                  local = image;
                  break;
                }
                await host.keyboard.press('Space', { delay: 320 });
                await delay(3200);
              }
              if (!local) throw new Error('Could not verify the host landed on the Local fighter screen');
              function changedPixels(before, after, x0=0, y0=0, x1=before.width, y1=before.height) {
                let count = 0;
                for (let y = y0; y < y1; y++) {
                  for (let x = x0; x < x1; x++) {
                    const pixel = (y * before.width + x) * 4;
                    const delta = Math.abs(before.data[pixel]-after.data[pixel]) +
                      Math.abs(before.data[pixel+1]-after.data[pixel+1]) +
                      Math.abs(before.data[pixel+2]-after.data[pixel+2]);
                    if (delta > 125) count++;
                  }
                }
                return count;
              }
              await guest.getByRole('button', { name: 'Join as player 2' }).click();
              await guest.getByText('The host received your join input.').waitFor();
              let joined = false;
              for (let i = 0; i < 8; i++) {
                if (changedPixels(local, await sample(), 248, 273, 309, 355) > 320) { joined = true; break; }
                await delay(700);
              }
              if (!joined) throw new Error('Unity did not show the second fighter after the guest clicked Join');
              console.log('Second fighter appeared in the real Unity Local lobby before the host readied up');
              await canvas.focus();
              await host.keyboard.press('Space', { delay: 300 });
              await guest.keyboard.press('Space', { delay: 450 });
              await delay(2000);
              for (let i = 0; !gameStarted && i < 5; i++) {
                await host.keyboard.press('Space', { delay: 300 });
                await delay(1700);
              }
              if (!gameStarted) throw new Error('Unity did not start the match after both fighters readied up');
              await delay(3000);
              const beforeGuestMove = await sample();
              await guest.keyboard.down('KeyA');
              try {
                await guest.getByText('Host received your movement controls.').waitFor({ timeout: 5000 });
                await host.waitForFunction(() => {
                  const pad = document.querySelector('#game').contentWindow.navigator.getGamepads().find(Boolean);
                  return pad?.axes[0] === -1;
                }, null, { polling: 25, timeout: 5000 });
                await delay(850);
              } finally {
                await guest.keyboard.up('KeyA');
              }
              const afterGuestMove = await sample();
              const guestPixels = changedPixels(beforeGuestMove, afterGuestMove);
              await canvas.focus();
              await host.keyboard.press('KeyD', { delay: 1000 });
              const hostPixels = changedPixels(afterGuestMove, await sample());
              console.log('Changed pixels after guest and host movement:', guestPixels, hostPixels);
              if (guestPixels < 100 || hostPixels < 100) throw new Error('Unity did not show the expected in-round screen response');
              await guest.getByRole('button', { name: 'Leave room' }).click();
              await host.getByText('The other player left the room.').waitFor({ timeout: 20000 });
              console.log('Live room, real Gang Beasts stream, second fighter, in-round inputs and visual response, and leave all passed');
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error('::error::' + error.message.replace(/\n/g, ' ')); process.exitCode = 1; });
          JS
